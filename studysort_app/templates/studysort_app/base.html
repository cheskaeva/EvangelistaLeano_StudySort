<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudySort{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --text-main: #333;
            --text-muted: #6c757d;
            --border-light: #e5e5e5;
            --bg-light: #f7f7f7;
            --bg-hover: #eeeeee;
        }

        body {
            background-color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            color: var(--text-main);
            line-height: 1.5;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-main) !important;
        }

        .card-clean {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 8px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border-light);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            background: white;
            color: var(--text-main);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--text-main);
            box-shadow: 0 0 0 1px var(--text-main);
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .btn-primary-custom {
            background: var(--text-main);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 16px;
            text-decoration: none;
        }

        .btn-primary-custom:hover {
            background: #222;
            text-decoration: none;
        }

        .btn-outline-custom {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            padding: 8px 16px;
        }

        .btn-outline-custom:hover {
            background: var(--bg-hover);
            border-color: var(--text-main);
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .notification {
            border: 1px solid var(--border-light);
            border-radius: 6px;
            font-size: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: white;
            color: var(--text-main);
        }

        .table th {
            background: var(--bg-light);
            border: none;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .table td {
            padding: 12px 16px;
            border-color: var(--bg-light);
            vertical-align: middle;
        }

        .btn-danger {
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">StudySort</a>
            <div class="navbar-nav ms-auto">
                {% if not request.session.hide_how_it_works %}
                    <a href="{% url 'hide_tutorial' %}" class="nav-link text-muted small">Hide guide</a>
                {% else %}
                    <a href="{% url 'show_tutorial' %}" class="nav-link text-muted small">Show guide</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if request.resolver_match.url_name != 'add_task' %}
    <div class="container my-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-outline alert-dismissible fade show" role="alert" style="border:1px solid var(--border-light); background:white; color:var(--text-main); border-radius:6px;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
